  skills: [python, excel, pdf, automation]
  category: automation
  proof_repo: download-autoprocessor
  proof_repo_url: https://github.com/Alejog20/download-autoprocessor
  hook: >-
    Manually turning your Excel rows into invoices every month is the kind of
    task that should already run itself while you do something better with
    your time.
  plan_bullet_1: Read invoice line items straight from your Excel sheet with openpyxl.
  plan_bullet_2: Generate branded PDF invoices using your template, one per client automatically.
  plan_bullet_3: Send each PDF by email on a schedule, with a log of what went out and when.
