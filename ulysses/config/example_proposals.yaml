# Curated "gold standard" example proposals, used by the Proposal Agent as
# few-shot examples via semantic retrieval (see tools/example_retrieval.py).
# Each entry is a stand-in job + the ideal response to it, decomposed into the
# same fields the LLM must produce (hook/plan_bullet_1-3/close/milestones), so
# the few-shot example mirrors the exact structured-output shape being asked
# for. Add more entries any time -- there's no fixed limit per category.

- job_title: "Scrape real estate listings nightly, export clean CSV, dedup required"
  job_description: >-
    We need a Python developer to scrape real estate listings from a public site
    every night and export clean rows to CSV. Must dedupe against previous runs
    so re-runs never create duplicate entries. Budget $150 fixed, posted 10
    minutes ago, 0 hires, payment verified.
  skills: [python, web scraping, csv]
  category: scraping
  proof_repo: Multiple_source_scraper
  proof_repo_url: https://github.com/Alejog20/Multiple_source_scraper
  hook: >-
    Losing hours to duplicate listings creeping into your CSV every night is
    exactly the kind of thing automation should have solved already.
  plan_bullet_1: Build a nightly scraper for the listing site, using Playwright for anything JS-rendered.
  plan_bullet_2: Deduplicate against previous runs by listing ID before writing new rows.
  plan_bullet_3: Schedule it via cron so it just runs -- no manual trigger needed.
  close: >-
    Happy to answer anything before we start -- do you already have the site's
    listing-page URL pattern figured out, or should I scope that first?
  milestones: []

