    Budget $250 fixed.
  skills: [python, pandas, excel, reporting]
  category: data_pipeline
  proof_repo: Invoice_generator_from_xlsx
  proof_repo_url: https://github.com/Alejog20/Invoice_generator_from_xlsx
  hook: >-
    Reconciling three spreadsheets by hand every week means small formatting
    mismatches are probably already slipping into your numbers without anyone
    noticing.
  plan_bullet_1: Pull data from all three spreadsheet formats with pandas, standardizing column names and types.
  plan_bullet_2: Merge and dedupe rows, flagging anything that doesn't reconcile for a quick manual check.
  plan_bullet_3: Output one clean weekly reporting sheet in the exact layout you already use.
